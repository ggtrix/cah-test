{"name":"Move files into folders","on":{"push":{"paths":[".github/workflows/reorg.yml"]}},"permissions":{"contents":"write"},"jobs":{"move":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"set -e\nmkdir -p site/img site/reports hub/img hub/reports\nfor f in borderhawk-white.png borderhawk.png sureshield-white.png sureshield.png; do cp \"$f\" hub/img/; git mv \"$f\" site/img/; done\nfor f in critical-access-hospital-grc-brief.html critical-access-hospital-industry-report.html critical-access-hospital-state-report.html; do cp \"$f\" hub/reports/; git mv \"$f\" site/reports/; done\nfor f in hub-privacy.html privacy-and-disclaimers.html; do cp \"$f\" hub/; git mv \"$f\" site/; done\ngit mv index.html site/index.html\ngit mv report-hub.html hub/report-hub.html\ntouch .nojekyll\ngit rm -q .github/workflows/reorg.yml\ngit add -A\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit commit -m \"Move files into site/ and hub/ folders\"\ngit push\n"}]}}}
